# Sri Lankan news source registry.
#
# `adapter` is resolved by running probe.py — do NOT trust the values below
# until you have. They are starting guesses. probe.py tests each outlet for
# RSS, the WordPress REST API, and a news sitemap, and prints the adapter
# that actually returns articles.
#
# adapter: rss | wordpress | sitemap | html
#
# Once an outlet is confirmed, pin the adapter and the exact URL here. When a
# site breaks, you change this file and re-run — no app release needed.

defaults:
  timeout: 20
  max_items: 40
  # Some Sri Lankan sites reject non-browser agents outright.
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36

sources:

  # ---------------------------------------------------------------- English

  - id: ada-derana-en
    name: Ada Derana
    lang: en
    site: https://www.adaderana.lk
    adapter: sitemap         # CONFIRMED: 10 items, 1h old
    feeds:                  # re-test these; probe skipped rss due to a bug
      - https://www.adaderana.lk/rss.php
      - https://www.adaderana.lk/rss.xml

  - id: daily-mirror
    name: Daily Mirror
    lang: en
    site: https://www.dailymirror.lk
    adapter: google         # fallback until a direct adapter is found
    # These were dropped by an earlier edit, so RSS was never actually tested
    # on this outlet. Try them: `python probe.py --id daily-mirror`.
    feeds:
      - https://www.dailymirror.lk/rss/108/breaking-news
      - https://www.dailymirror.lk/RSS_Feeds/breaking-news
      - https://www.dailymirror.lk/rss.xml
    listings:
      - https://www.dailymirror.lk/latest-news/342
      - https://www.dailymirror.lk/top-storys/155
      - https://www.dailymirror.lk/business
    # First attempt used lk_news's "div.col-md-8", which matched the page
    # chrome and produced 2 items headlined "E-PAPER". Narrow to the story
    # cards themselves; verify with: python probe.py --id daily-mirror
    selectors:
      item: "div.col-md-8 div.row, article, .lineg"
      link: "a[href*='/']"
      title: "h2, h3, .lineg a"
      image: "img"

  - id: economynext
    name: EconomyNext
    lang: en
    site: https://economynext.com
    adapter: wordpress       # CONFIRMED: 10 items, all with images

  - id: newswire
    name: Newswire
    lang: en
    site: https://www.newswire.lk
    adapter: wordpress       # CONFIRMED: 10 items, all with images

  - id: newsfirst-en
    name: NewsFirst
    lang: en
    site: https://english.newsfirst.lk
    adapter: newsfirst       # CONFIRMED: in-house JSON API, one GET, real dates
    api: https://apienglish.newsfirst.lk

  - id: daily-ft
    name: Daily FT
    lang: en
    site: https://www.ft.lk
    adapter: google          # google only, 18h old

  - id: the-morning
    name: The Morning
    lang: en
    site: https://www.themorning.lk
    adapter: google          # google only, 35h old

  # ---------------------------------------------------------------- Sinhala

  - id: ada-derana-si
    name: Ada Derana Sinhala
    lang: si
    site: https://sinhala.adaderana.lk
    adapter: sitemap         # CONFIRMED: 10 items, 0h old
    feeds:                  # re-test; probe skipped rss due to a bug
      - https://sinhala.adaderana.lk/rss.php
      - https://sinhala.adaderana.lk/rss.xml

  - id: divaina
    name: Divaina
    lang: si
    site: https://www.divaina.lk
    adapter: wordpress       # CONFIRMED: 10 items, 9 with images

  - id: lankadeepa
    name: Lankadeepa
    lang: si
    site: https://www.lankadeepa.lk
    adapter: html            # CONFIRMED: 10 items, all with images
    listings:
      - https://www.lankadeepa.lk/latest_news/1
      - https://www.lankadeepa.lk/breaking_news/1
    selectors:
      item: ".news-item, article, .lead-story, .cat-list-text, .me-item-text"
      link: "a"
      title: "h2, h3, .title"
      image: "img"
      # Confirmed via inspect_dates.py: the listing shows an English date
      # ("11 September 2026") here, so most articles need no extra fetch.
      date: ".story-meta span, .story-meta"
      # Article pages carry a Sinhala date with a time
      # ("2026 සැප්තැම්බර් 12 | ප.ව. 06:34"), used when the listing has none.
      article_date: ".article-meta"

  - id: mawbima
    name: Mawbima
    lang: si
    site: https://www.mawbima.lk
    adapter: wordpress
    enabled: false
    feeds:
      - https://www.mawbima.lk/feed
      - https://www.mawbima.lk/rss.xml
    # Parked 2026-09-13: Cloudflare *interactive challenge* on the whole
    # domain, robots.txt included -- `cf-mitigated: challenge`, a "Just a
    # moment..." page asking for JavaScript. A browser solves it and gets in
    # (confirmed in-browser: "Performing security verification"); this client
    # executes no JS, so it sees 403 on every rung. Google has 0 for the
    # domain, so there is no fallback either.
    #
    # A residential IP does NOT fix this -- the challenge is about running
    # JavaScript, not about where the request came from. The only real options
    # are publisher-granted feed access or a headless browser, and a browser
    # in a 20-minute cron is a big dependency for one Sinhala source.
    # Re-check with: probe.py --id mawbima --diagnose

  # ------------------------------------------------------------------ Tamil

  - id: ada-derana-ta
    name: Ada Derana Tamil
    lang: ta
    # NOT a subdomain of adaderana.lk: the Tamil edition lives on its own
    # domain, and tamil.adaderana.lk does not resolve. That wrong guess is
    # why this source sat parked on a google adapter.
    site: https://adaderanatamil.lk
    adapter: rss             # CONFIRMED: 40 items, all with excerpts, 0h old
    feed: https://adaderanatamil.lk/rss.xml
    # Only the one feed: /rss.php 302s to this exact file, and listing both
    # made from_rss() fetch it twice and report a doubled `count` in
    # status.json (it does not dedupe across feeds -- ingest's dedupe() does).
    # /wp-json 403s and /news-sitemap.xml lags ~17h behind the feed, so RSS is
    # both the cheapest and the freshest option here. No images in the feed --
    # enrichment fills them from og:image.

  - id: virakesari
    name: Virakesari
    lang: ta
    site: https://www.virakesari.lk
    adapter: google          # google only, 33h old

  - id: thinakkural
    name: Thinakkural
    lang: ta
    site: https://www.thinakkural.lk
    adapter: wordpress
    enabled: false
    feeds:
      - https://www.thinakkural.lk/feed
      - https://www.thinakkural.lk/rss.xml
    # Parked 2026-09-13: the site is broken for everyone, not just for us.
    # https://www.thinakkural.lk/ answers 308 redirecting to *itself*, an
    # infinite self-loop (the apex does the same), so a real browser fails
    # with the same error we get. Confirmed by the maintainer in-browser.
    # Google has dropped it too: a site:thinakkural.lk search returns 0.
    #
    # DO NOT "fix" this by switching to thinakkural.com. That domain resolves
    # and loads, but it is not the newspaper -- it now serves CPAP-machine SEO
    # spam (see its sitemap.xml). Ada Derana Tamil really did live on another
    # domain; this one does not.
    #
    # Re-check by loading the .lk URL in a browser. If it stops self-
    # redirecting, the wordpress/rss rungs are worth re-probing.

  - id: tamil-mirror
    name: Tamil Mirror
    lang: ta
    site: https://www.tamilmirror.lk
    adapter: google          # google only, 8h old
    listings:
      - https://www.tamilmirror.lk/breaking-news/150
      - https://www.tamilmirror.lk/latest-news/151
    selectors:
      item: "article, .news-item"
      link: "a"
      title: "h2, h3, .title"
      image: "img"
      date: "time, .date, .post-date, .story-meta span"
      article_date: ".article-meta, .post-date, time"

  # ------------------------------------------------ added, from lk_news's list
  # These are outlets nuuuwan's dataset covers that we had missed. BBC in
  # particular is worth having: it publishes proper feeds in both Sinhala and
  # Tamil, which is exactly where local outlets are weakest. lk_news scrapes
  # BBC Sinhala's HTML instead and currently gets nothing from it.

  - id: bbc-sinhala
    name: BBC Sinhala
    lang: si
    site: https://www.bbc.com/sinhala
    adapter: rss             # CONFIRMED: 10 items, 6h old
    feeds:
      - https://feeds.bbci.co.uk/sinhala/rss.xml

  - id: bbc-tamil
    name: BBC Tamil
    lang: ta
    site: https://www.bbc.com/tamil
    adapter: rss             # CONFIRMED: 10 items, 0h old — best Tamil source
    feeds:
      - https://feeds.bbci.co.uk/tamil/rss.xml

  - id: ada-lk
    name: Ada.lk
    lang: si
    site: https://www.ada.lk
    adapter: sitemap
    enabled: false
    sitemap: https://www.ada.lk/sitemaps
    feeds:
      - https://www.ada.lk/rss.php
      - https://www.ada.lk/feed
    # Parked 2026-09-13. The real sitemap index is /sitemaps (no extension,
    # per robots.txt) -- the guessed *news*.xml paths all 404 and rss.php is
    # gone. But it is not usable: the index takes ~25s, its newest chunk
    # ~62s, and that chunk carries 999 URLs with no <lastmod> or
    # news:publication_date at all. Undated articles can never satisfy the
    # verified-freshness gate, so this costs ~86s per run and still falls
    # through to Google. `sitemap:` is pinned above so a future attempt
    # starts from the right URL rather than re-deriving it.

  - id: island
    name: The Island
    lang: en
    site: https://island.lk
    adapter: google          # google only, 4h old

  - id: ceylon-today
    name: Ceylon Today
    lang: en
    site: https://ceylontoday.lk
    adapter: google
    enabled: false        # 403s us; Google has ~2 stale articles

  - id: colombo-telegraph
    name: Colombo Telegraph
    lang: en
    site: https://www.colombotelegraph.com
    adapter: google          # google only, 34h old

  - id: newsfirst-ta
    name: NewsFirst Tamil
    lang: ta
    site: https://tamil.newsfirst.lk
    adapter: newsfirst       # CONFIRMED: in-house JSON API, one GET, real dates
    api: https://apitamil.newsfirst.lk

  - id: newsfirst-si
    name: NewsFirst Sinhala
    lang: si
    site: https://sinhala.newsfirst.lk
    adapter: newsfirst       # CONFIRMED: in-house JSON API, one GET, real dates
    api: https://apisinhala.newsfirst.lk
    # Not WordPress from outside: /feed 403s and /wp-json answers 200 with the
    # SPA shell, which is why this used to fall through to a stale Google feed.

