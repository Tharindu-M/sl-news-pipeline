name: Offline checks

on:
  push:
    paths: ["**.py", "requirements.txt", ".github/workflows/**"]
  pull_request:
    paths: ["**.py", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pyflakes *.py tests/*.py
      - run: python tests/test_pipeline.py
      - run: python tests/test_e2e.py
      - run: python -m unittest discover -s tests -p test_reliability.py
