name: Health check

# The lesson from nuuuwan/lk_news: after four years of maintenance, 13 of its
# 17 scrapers silently produce nothing. Nobody gets paged, so nobody notices.
#
# This runs once a day against the live feeds and opens (or updates) a single
# GitHub issue listing every source that has been dead for more than 48 hours.
# You find out from a notification, not from a one-star review.

on:
  schedule:
    - cron: "0 3 * * *"      # 08:30 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live status
        id: status
        env:
          FEED_BASE: ${{ vars.FEED_BASE }}   # e.g. https://user.github.io/repo
        run: |
          set -euo pipefail
          : "${FEED_BASE:?Set the FEED_BASE repository variable to your Pages base URL}"
          curl --max-time 30 -fsS "$FEED_BASE/v1/status.json" -o status.json

          # Every feed must exist and be non-empty. Borrowed from
          # KOTTAGENVH's scraper_check.yaml, which asserts the same per source.
          for lang in en si ta; do
            curl --max-time 30 -fsS "$FEED_BASE/v1/feed_$lang.json" -o "feed_$lang.json"
            jq -e '.articles | length > 0' "feed_$lang.json" > /dev/null \
              || { echo "::error::feed_$lang.json is empty or missing"; exit 1; }
            generated=$(jq -r '.generated' "feed_$lang.json")
            age=$(date -d "$generated" +%s)
            seconds=$(( $(date +%s) - age ))
            if [ "$seconds" -gt 21600 ] || [ "$seconds" -lt -300 ]; then
              echo "::error::feed_$lang.json has a stale or future generation time"
              exit 1
            fi
          done

          echo "All language snapshots are non-empty and recently generated."

      - name: Report dead sources
        if: always()
        uses: actions/github-script@v7
        env:
          FETCH_OUTCOME: ${{ steps.status.outcome }}
        with:
          script: |
            const fs = require('fs');
            let s = {};
            try { s = JSON.parse(fs.readFileSync('status.json', 'utf8')); }
            catch { core.warning('Could not read status.json'); }

            const dead = s.dead || [];
            const fallback = s.on_fallback || [];
            const stale = s.stale_sources || [];
            const google = s.google_sources || [];
            const fetchFailed = process.env.FETCH_OUTCOME !== 'success';
            const title = 'News source problems';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline',
            });
            const existing = issues.find(i => i.title === title);

            if (!fetchFailed && dead.length === 0 && fallback.length === 0
                && stale.length === 0 && google.length === 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
              }
              core.info('All sources healthy.');
              return;
            }

            const rows = dead.map(id => {
              const d = (s.detail || {})[id] || {};
              const h = d.hours_since_ok == null ? 'never' : `${d.hours_since_ok}h`;
              return `| \`${id}\` | ${d.lang || '?'} | ${d.adapter || '?'} | ${h} | ${d.error || '0 articles'} |`;
            }).join('\n');

            const fbRows = fallback.map(id => {
              const d = (s.detail || {})[id] || {};
              return `| \`${id}\` | ${d.lang || '?'} | ${d.adapter || '?'} | ${(d.primary_error || '').slice(0, 90)} |`;
            }).join('\n');

            const body = [
              ...(fetchFailed ? [
                '**Live feed validation failed.** Check the health-check run logs; do not treat this snapshot as current.',
                '',
              ] : []),
              dead.length
                ? `${dead.length} of ${s.sources_total} sources are dead (>48h).`
                : (fetchFailed ? 'Current source health could not be verified.'
                               : 'No dead sources reported in the accepted snapshot.'),
              '',
              ...(dead.length ? [
                '| source | lang | adapter | silent for | error |',
                '|---|---|---|---|---|',
                rows,
                '',
              ] : []),
              ...(fallback.length ? [
                `### ${fallback.length} source(s) running on a fallback adapter`,
                '',
                '| source | lang | intended adapter | why the primary failed |',
                '|---|---|---|---|',
                fbRows,
                '',
              ] : []),
              ...(stale.length ? [
                '### Stale or unverified publication dates',
                ...stale.map(id => {
                  const d = (s.detail || {})[id] || {};
                  return `- \`${id}\`: newest publication age ${d.hours_since_publication ?? 'unknown'}h; ${d.new_articles ?? 0} newly observed articles.`;
                }),
                '',
              ] : []),
              ...(google.length ? [
                '### Google News dependency',
                'Includes sources explicitly configured for Google, not just automatic fallbacks.',
                ...google.map(id => `- \`${id}\``),
                '',
              ] : []),
              'Fix: `python probe.py --id <source>` to find a working adapter,',
              'then update `sources.yaml`. Prefer rss > wordpress > sitemap > html.',
              '',
              `_Last run: ${s.generated}_`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline'],
              });
            }
