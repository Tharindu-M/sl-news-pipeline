name: Ingest news

on:
  schedule:
    # Every 20 minutes. GitHub often runs cron a few minutes late and will
    # occasionally skip a slot under load — fine for news, and the merge
    # logic in ingest.py means a skipped run costs nothing.
    - cron: "*/20 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]
    paths: ["sources.yaml", "*.py", "requirements.txt", "tests/**", ".github/workflows/ingest.yml"]

# Never let two runs write the feeds at once.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Catch undefined names and broken logic before they can take out a run.
      # A deleted helper once passed every local check and only surfaced as a
      # NameError partway through a deployed job.
      - name: Static check
        run: |
          pip install pyflakes
          python -m pyflakes *.py tests/*.py

      - name: Tests
        run: |
          python tests/test_pipeline.py
          python tests/test_e2e.py
          python -m unittest discover -s tests -p test_reliability.py

      # Pull down last run's output so ingest.py can merge rather than
      # rebuild from scratch. Without this, a source being briefly down
      # would make its articles disappear from users' apps.
      - name: Restore previous feeds
        uses: actions/cache/restore@v4
        with:
          path: public
          key: accepted-feeds-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: accepted-feeds-v2-

      - name: Run ingestion
        run: python ingest.py --out public --diagnostics diagnostics/status.json

      # Health summary lands on the Actions run page.
      - name: Report
        if: always()
        run: |
          if [ -f diagnostics/status.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          s = json.load(open("diagnostics/status.json"))
          print(f"### {s['sources_ok']}/{s['sources_total']} sources healthy\n")
          print(f"Accepted: {s['accepted']}; errors: {s['errors']}\n")
          print(f"Stale content: {', '.join(s['stale_sources']) or 'none'}\n")
          print(f"Google-dependent: {', '.join(s['google_sources']) or 'none'}\n")
          print(f"Articles: " + ", ".join(f"{k}={v}" for k, v in s["totals"].items()) + "\n")
          bad = [(k, v) for k, v in s["detail"].items() if not v["ok"]]
          if bad:
              print("| source | adapter | error |")
              print("|---|---|---|")
              for k, v in bad:
                  print(f"| {k} | {v['adapter']} | {v['error']} |")
          PY
          fi

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-diagnostics-${{ github.run_attempt }}
          path: diagnostics/status.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      # Never restore rejected or undeployed output on the next run.
      - name: Save accepted feeds
        uses: actions/cache/save@v4
        with:
          path: public
          key: accepted-feeds-v2-${{ github.run_id }}-${{ github.run_attempt }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
